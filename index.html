<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repositorio aleatorio de GitHub</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>

<script src="script.js"></script>
